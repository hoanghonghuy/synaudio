services:
  postgres:
    image: postgres:16-alpine
    container_name: synaudio-postgres
    environment:
      POSTGRES_DB: synaudio
      POSTGRES_USER: synaudio
      POSTGRES_PASSWORD: synaudio
    ports:
      - "5432:5432"
    volumes:
      - synaudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaudio -d synaudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: synaudio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - synaudio_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: synaudio-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/synaudio || true;
      exit 0;
      "

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: synaudio-migrate
    command: ["-path=/migrations", "-database", "postgres://synaudio:synaudio@postgres:5432/synaudio?sslmode=disable", "up"]
    volumes:
      - ./backend/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synaudio-backend-api
    environment:
      - APP_ENV=development
      - HTTP_ADDR=:8080
      - DATABASE_URL=postgres://synaudio:synaudio@postgres:5432/synaudio?sslmode=disable
      - STORAGE_PROVIDER=minio
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=synaudio
      - STORAGE_ACCESS_KEY=minio
      - STORAGE_SECRET_KEY=minio12345
      - SIGNED_AUDIO_URL_TTL=15m
      - AI_MODE=mock
      - TTS_MODE=mock
      - TEXT_AI_PROVIDER=mock
      - TTS_PROVIDER=mock
      - APP_PUBLIC_URL=http://localhost
      - API_PUBLIC_URL=http://localhost:${SYNAUDIO_API_PORT:-8080}
      - CORS_ALLOWED_ORIGINS=http://localhost
      - ALLOW_REMOTE_DATABASE_IN_DEV=false
      - ALLOW_REMOTE_STORAGE_IN_DEV=false
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_SESSION_TTL=720h
      - RECENT_AUTH_WINDOW=10m
    ports:
      - "${SYNAUDIO_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synaudio-backend-worker
    command: ["/app/worker"]
    environment:
      - APP_ENV=development
      - HTTP_ADDR=:8080
      - DATABASE_URL=postgres://synaudio:synaudio@postgres:5432/synaudio?sslmode=disable
      - STORAGE_PROVIDER=minio
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_BUCKET=synaudio
      - STORAGE_ACCESS_KEY=minio
      - STORAGE_SECRET_KEY=minio12345
      - SIGNED_AUDIO_URL_TTL=15m
      - AI_MODE=mock
      - TTS_MODE=mock
      - TEXT_AI_PROVIDER=mock
      - TTS_PROVIDER=mock
      - APP_PUBLIC_URL=http://localhost
      - API_PUBLIC_URL=http://localhost:${SYNAUDIO_API_PORT:-8080}
      - CORS_ALLOWED_ORIGINS=http://localhost
      - ALLOW_REMOTE_DATABASE_IN_DEV=false
      - ALLOW_REMOTE_STORAGE_IN_DEV=false
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_SESSION_TTL=720h
      - RECENT_AUTH_WINDOW=10m
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synaudio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  synaudio_postgres_data:
  synaudio_minio_data: