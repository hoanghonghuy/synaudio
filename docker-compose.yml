services:
  postgres:
    image: postgres:16-alpine
    container_name: synaudio-postgres
    environment:
      POSTGRES_DB: synaudio
      POSTGRES_USER: synaudio
      POSTGRES_PASSWORD: synaudio
    ports:
      - "5432:5432"
    volumes:
      - synaudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaudio -d synaudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: synaudio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - synaudio_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: synaudio-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/synaudio || true;
      exit 0;
      "

volumes:
  synaudio_postgres_data:
  synaudio_minio_data:
