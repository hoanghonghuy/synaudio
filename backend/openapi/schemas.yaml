        storage_key: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        bitrate_kbps: { type: integer }
    NarrationRevisionPascal:
      type: object
      properties:
        ID: { type: string }
