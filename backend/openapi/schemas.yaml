          type: array
          items: { $ref: "#/components/schemas/LibraryItem" }
        completed:
          type: array
          items: { $ref: "#/components/schemas/LibraryItem" }
        favorites:
          type: array
          items: { $ref: "#/components/schemas/FavoriteStory" }
    LibraryItem:
      type: object
      properties:
