openapi: "3.1.0"
info:
  title: AI Audiobook Platform API
  version: 0.1.0
  description: HTTP contract skeleton for Phase 0 foundation.
servers:
  - url: http://localhost:8080
    description: Local API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [Platform]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReady
      summary: Readiness probe
      tags: [Platform]
      responses:
        "200":
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Required dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    ErrorResponse:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
        error:
          type: string
