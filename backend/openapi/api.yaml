                    type: integer
                ChapterID:
                    type: string
                Checksum:
                    type: string
                DurationMs:
                    format: int64
                    type: integer
                ID:
                    type: string
                IsActive:
                    type: boolean
                MimeType:
                    type: string
                SizeBytes:
                    format: int64
                    type: integer
                SourceNarrationRevisionID:
                    type: string
                Status:
