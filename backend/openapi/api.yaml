components:
    responses:
        BadRequest:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Request validation failed
        Forbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Authenticated principal is not allowed to perform the operation
        Unauthenticated:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: Authentication required or credential invalid
    schemas:
        ActivationReadinessResponse:
            properties:
                generation_policy:
                    $ref: '#/components/schemas/GenerationPolicyResponse'
                missing:
                    items:
                        type: string
                    type: array
                ready:
                    type: boolean
                story_workspace:
                    properties:
                        cover_asset_id:
                            type: string
                        planning_mode:
                            type: string
                        planning_phase:
                            type: string
                        public_rating:
                            type: string
                        public_warnings:
                            items:
                                type: string
                            type: array
                    type: object
            required:
                - ready
                - missing
            type: object
        AdminChapterContentResponse:
            properties:
                generation_job:
                    $ref: '#/components/schemas/JobViewPascal'
                generation_run:
                    $ref: '#/components/schemas/GenerationRunPascal'
                revisions:
                    items:
                        $ref: '#/components/schemas/ContentRevisionPascal'
                    type: array
            required:
                - revisions
            type: object
        AdminStatusRequest:
            properties:
                status:
                    enum:
                        - ACTIVE
                        - SUSPENDED
                        - DEACTIVATED
                    type: string
            required:
                - status
            type: object
        AdminUserListResponse:
            properties:
                users:
                    items:
                        $ref: '#/components/schemas/AdminUserSummary'
                    type: array
            required:
                - users
            type: object
        AdminUserSummary:
            properties:
                display_name:
                    type: string
                email:
                    format: email
                    type: string
                email_verified:
                    type: boolean
                id:
                    type: string
                roles:
                    items:
                        enum:
                            - GUEST
                            - USER
                            - ADMIN
                        type: string
                    type: array
                status:
                    enum:
                        - ACTIVE
                        - SUSPENDED
                        - DEACTIVATED
                    type: string
            required:
                - id
                - email
                - display_name
                - status
                - email_verified
                - roles
            type: object
        AnalyzeDurationRequest:
            properties:
                revision_id:
                    type: string
                text:
                    type: string
            type: object
        ApplyRetconRequest:
            properties:
                applied_by:
                    type: string
            type: object
        ApproveContentRequest:
            properties:
                approved_by:
                    type: string
                revision_id:
                    type: string
            required:
                - revision_id
            type: object
        ApproveRetconRequest:
            properties:
                approved_by:
                    type: string
            type: object
        ArcCompletionResultPascal:
            properties:
                ArcID:
                    type: string
                Complete:
                    type: boolean
                CompletedChapters:
                    type: integer
                PendingChapters:
                    items:
                        type: string
                    type: array
                TotalChapters:
                    type: integer
            type: object
        AttentionItemListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AttentionItemPascal'
                    type: array
            required:
                - items
            type: object
        AttentionItemPascal:
            properties:
                Action:
                    type: string
