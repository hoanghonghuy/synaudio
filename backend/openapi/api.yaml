                    type: string
                Detail:
                    type: string
                ID:
                    type: string
                Kind:
                    type: string
                Priority:
                    type: string
                Resolved:
                    type: boolean
                StoryID:
                    type: string
                Title:
                    type: string
            type: object
        AudioAssetPascal:
            properties:
