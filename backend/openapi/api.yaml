                    type: string
            required:
                - url
            type: object
        AuditEvent:
            properties:
                action:
                    type: string
                actor_type:
                    enum:
                        - USER
                        - SYSTEM
                        - AI
                        - ANONYMOUS
                    type: string
                actor_user_id:
                    type: string
                chapter_id:
                    type: string
                correlation_id:
                    type: string
                created_at:
                    format: date-time
                    type: string
                generation_run_id:
                    type: string
                id:
                    type: string
                metadata:
                    additionalProperties: true
                    type: object
                provenance:
                    additionalProperties: true
                    type: object
                request_id:
                    type: string
                resource_id:
                    type: string
                resource_type:
                    type: string
                result:
