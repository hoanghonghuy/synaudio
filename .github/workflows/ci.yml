name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synaudio
          POSTGRES_USER: synaudio
          POSTGRES_PASSWORD: synaudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synaudio -d synaudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://synaudio:synaudio@localhost:5432/synaudio?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Verify sqlc generated code
        id: sqlc_check
        working-directory: .
        continue-on-error: true
        run: make sqlc-check
      - name: Upload sqlc drift diagnostics
        if: steps.sqlc_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sqlc-drift-${{ github.sha }}
          path: backend/internal/platform/db
      - name: Fail on sqlc verification error
        if: steps.sqlc_check.outcome == 'failure'
        working-directory: .
        run: exit 1
      - name: Verify sqlc drift gate regression
        working-directory: .
        run: make sqlc-check-regression
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build API
        run: go build -o bin/api ./cmd/api
      - name: Build Worker
        run: go build -o bin/worker ./cmd/worker

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
