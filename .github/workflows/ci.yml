name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synaudio
          POSTGRES_USER: synaudio
          POSTGRES_PASSWORD: synaudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synaudio -d synaudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://synaudio:synaudio@localhost:5432/synaudio?sslmode=disable
      GOVULNCHECK_VERSION: v1.8.0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: backend/go.sum
      - name: Go dependency vulnerability scan
        working-directory: .
        run: bash ./scripts/govulncheck-gate.sh
      - name: Verify govulncheck gate regression
        working-directory: .
        run: bash ./scripts/test-govulncheck-gate.sh
      - name: Verify sqlc generated code
        id: sqlc_check
        working-directory: .
        continue-on-error: true
        run: make sqlc-check
      - name: Upload sqlc drift diagnostics
        if: steps.sqlc_check.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlc-drift-${{ github.sha }}
          path: backend/internal/platform/db
      - name: Fail on sqlc verification error
        if: steps.sqlc_check.outcome == 'failure'
        working-directory: .
        run: exit 1
      - name: Verify sqlc drift gate regression
        working-directory: .
        run: make sqlc-check-regression
      - name: Verify restore isolation gate regression
        working-directory: .
        run: make restore-isolation-regression
      - name: Verify backup target gate regression
        working-directory: .
        run: make backup-target-regression
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build API
        run: go build -o bin/api ./cmd/api
      - name: Build Worker
        run: go build -o bin/worker ./cmd/worker

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: npm dependency vulnerability scan
        working-directory: .
        run: bash ./scripts/npm-audit-gate.sh
      - name: Verify npm audit gate regression
        working-directory: .
        run: bash ./scripts/test-npm-audit-gate.sh
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
