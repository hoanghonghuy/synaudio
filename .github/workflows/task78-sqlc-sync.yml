name: Task 78 sqlc sync

on:
  push:
    branches:
      - task/78-reconcile-expired-attempts

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/78-reconcile-expired-attempts
      - name: Generate sqlc
        run: docker run --rm -v "$PWD/backend:/src" -w /src/db sqlc/sqlc:1.29.0 generate
      - name: Commit generated output
        run: |
          if git diff --quiet -- backend/internal/platform/db; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/platform/db
          git commit -m "chore: regenerate sqlc for task 78"
          git push origin HEAD:task/78-reconcile-expired-attempts
