name: OpenAPI Repair Temp
on:
  push:
    branches:
      - chore/16-openapi-contract
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/16-openapi-contract
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.6'
      - name: Patch missing route bindings and path stubs
        shell: python
        run: |
          from pathlib import Path

          contract = Path('backend/openapi/contract.go')
          text = contract.read_text()
          anchor = '\t"postApiV1AdminStoriesStoryidCanonBranches":    {Request: "CreateCanonBranchRequest", Response: "CanonBranchPascal", SuccessStatus: 201, Description: "Canon branch created"},\n'
          addition = anchor + '\t"getApiV1AdminStoriesStoryidCanonBranchesActiveOfficial": {Response: "CanonBranchPascal", Description: "Active OFFICIAL canon branch"},\n'
          if 'getApiV1AdminStoriesStoryidCanonBranchesActiveOfficial' not in text:
              if anchor not in text:
                  raise SystemExit('canon binding anchor not found')
              text = text.replace(anchor, addition, 1)
          audio_anchor = '\t"getApiV1AdminChaptersChapteridAudio":    {Response: "AudioAssetPascal", Description: "Active audio asset"},\n'
          audio_addition = audio_anchor + '\t"getApiV1AdminChaptersChapteridAudioAssetidPreviewUrl": {Response: "AudioURLResponse", Description: "Admin audio preview URL"},\n'
          if 'getApiV1AdminChaptersChapteridAudioAssetidPreviewUrl' not in text:
              if audio_anchor not in text:
                  raise SystemExit('audio binding anchor not found')
              text = text.replace(audio_anchor, audio_addition, 1)
          contract.write_text(text)

          api = Path('backend/openapi/api.yaml')
          y = api.read_text()
          stubs = '''    /api/v1/admin/chapters/{chapterID}/audio/{assetID}/preview-url:\n        parameters:\n            - in: path\n              name: chapterID\n              required: true\n              schema:\n                type: string\n            - in: path\n              name: assetID\n              required: true\n              schema:\n                type: string\n        get:\n            operationId: getApiV1AdminChaptersChapteridAudioAssetidPreviewUrl\n            responses:\n                "200":\n                    description: Admin audio preview URL\n            security:\n                - bearerAuth: []\n    /api/v1/admin/stories/{storyID}/canon-branches/active-official:\n        parameters:\n            - in: path\n              name: storyID\n              required: true\n              schema:\n                type: string\n        get:\n            operationId: getApiV1AdminStoriesStoryidCanonBranchesActiveOfficial\n            responses:\n                "200":\n                    description: Active OFFICIAL canon branch\n            security:\n                - bearerAuth: []\n'''
          if '/api/v1/admin/chapters/{chapterID}/audio/{assetID}/preview-url:' not in y:
              marker = '\ncomponents:\n'
              if marker not in y:
                  raise SystemExit('components marker not found')
              y = y.replace(marker, '\n' + stubs + 'components:\n', 1)
          api.write_text(y)
      - name: Regenerate OpenAPI and frontend boundary
        working-directory: backend
        run: |
          gofmt -w openapi/contract.go openapi/typescript.go openapi/typescript_test.go
          REGEN_OPENAPI=1 go test ./openapi -run '^TestRegenerateAPIContract$'
          REGEN_OPENAPI_FRONTEND=1 go test ./openapi -run '^TestRegenerateFrontendContract$'
          go test ./openapi
      - name: Commit regenerated contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/openapi frontend/src/api/openapi.generated.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(openapi): reconcile runtime routes and generated types'
          git push origin HEAD:chore/16-openapi-contract
