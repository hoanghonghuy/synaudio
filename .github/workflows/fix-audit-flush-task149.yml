name: Fix task 149 audit flush

on:
  push:
    branches:
      - task/149-creative-decision-postpone
    paths:
      - .github/workflows/fix-audit-flush-task149.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: task/149-creative-decision-postpone
          fetch-depth: 0
      - name: Restore default response status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/audit/middleware.go')
          text = path.read_text()
          old = '''\tdst.WriteHeader(w.status)\n\t_, _ = dst.Write(w.body.Bytes())\n}'''
          new = '''\tstatus := w.status\n\tif status == 0 {\n\t\tstatus = http.StatusOK\n\t}\n\tdst.WriteHeader(status)\n\t_, _ = dst.Write(w.body.Bytes())\n}'''
          if old not in text:
              raise SystemExit('audit flush target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and push fix
        run: |
          rm .github/workflows/fix-audit-flush-task149.yml
          git config user.name 'SYNAUDIO-A'
          git config user.email '111640702+hoanghonghuy@users.noreply.github.com'
          git add backend/internal/audit/middleware.go .github/workflows/fix-audit-flush-task149.yml
          git commit -m 'fix: preserve audit default response status'
          git push origin HEAD:task/149-creative-decision-postpone
