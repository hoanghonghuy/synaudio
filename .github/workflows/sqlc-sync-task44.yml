name: Task 44 sqlc sync

on:
  push:
    branches:
      - fix/44-generation-max-attempt-budget

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/44-generation-max-attempt-budget
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
      - name: Generate
        id: generate
        continue-on-error: true
        working-directory: backend/db
        run: |
          set -o pipefail
          sqlc generate 2>&1 | tee /tmp/task44-sqlc.log
      - name: Upload sqlc diagnostics
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: task44-sqlc-diagnostics
          path: /tmp/task44-sqlc.log
      - name: Fail on generation error
        if: steps.generate.outcome == 'failure'
        run: exit 1
      - name: Commit generated output
        if: steps.generate.outcome == 'success'
        run: |
          if git diff --quiet -- backend/internal/platform/db; then
            echo "sqlc output already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/platform/db
          git commit -m "chore: regenerate generation sqlc output"
          git push origin HEAD:fix/44-generation-max-attempt-budget
