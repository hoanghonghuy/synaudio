name: Task 44 sqlc sync

on:
  push:
    branches:
      - fix/44-generation-max-attempt-budget

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/44-generation-max-attempt-budget
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
      - name: Generate task 44 query output
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf /tmp/task44-sqlc
          mkdir -p /tmp/task44-sqlc/queries /tmp/task44-sqlc/out
          cp backend/db/queries/generation.sql /tmp/task44-sqlc/queries/generation.sql
          ln -s "$GITHUB_WORKSPACE/backend/db/migrations" /tmp/task44-sqlc/migrations
          cat > /tmp/task44-sqlc/sqlc.yaml <<'EOF'
          version: "2"
          sql:
            - engine: "postgresql"
              queries: "queries/generation.sql"
              schema: "migrations"
              gen:
                go:
                  package: "db"
                  out: "out"
                  sql_package: "pgx/v5"
                  emit_json_tags: true
                  emit_empty_slices: true
          EOF
          cd /tmp/task44-sqlc
          sqlc generate 2>&1 | tee /tmp/task44-sqlc.log
          cp out/generation.sql.go "$GITHUB_WORKSPACE/backend/internal/platform/db/generation.sql.go"
      - name: Upload sqlc diagnostics
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: task44-sqlc-diagnostics
          path: /tmp/task44-sqlc.log
      - name: Fail on generation error
        if: steps.generate.outcome == 'failure'
        run: exit 1
      - name: Commit generated output
        if: steps.generate.outcome == 'success'
        run: |
          if git diff --quiet -- backend/internal/platform/db/generation.sql.go; then
            echo "task 44 generated output already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/platform/db/generation.sql.go
          git commit -m "chore: regenerate task 44 sqlc output"
          git push origin HEAD:fix/44-generation-max-attempt-budget
